<ng-template #content><ng-content /></ng-template>

@if (!enabled()) {
  <ng-container [ngTemplateOutlet]="content" />
} @else if (docked()) {
  <div class="side-dock" role="group" [attr.aria-label]="label()">
    <button
      #reopenButton
      type="button"
      class="side-dock__button"
      aria-expanded="false"
      [attr.aria-label]="theme.tone()['calendar.column_reopen']"
      (click)="onToggle()"
    >
      <span aria-hidden="true">‹</span>
    </button>
    <span class="side-dock__label" aria-hidden="true">{{ label() }}</span>
  </div>
} @else {
  <div class="side-dock__bar">
    <button
      #dockButton
      type="button"
      class="side-dock__button"
      aria-expanded="true"
      [attr.aria-label]="theme.tone()['calendar.column_dock']"
      (click)="onToggle()"
    >
      <span aria-hidden="true">›</span>
    </button>
  </div>
  <ng-container [ngTemplateOutlet]="content" />
}
