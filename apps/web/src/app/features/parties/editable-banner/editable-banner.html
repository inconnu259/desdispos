<!-- Story 53.6 (⚠️ planche UI) : bannière de la page d'une partie. Les puces sont sœurs de la bannière
     (jamais dedans : elle est aria-hidden) et n'existent que si le serveur autorise le changement. -->
<div class="editable-banner">
  <app-party-banner
    class="editable-banner__banner"
    [partieId]="partie().id"
    [partieName]="partie().name"
    [coverImageVersion]="partie().coverImageVersion"
    mode="large"
  />

  @if (canUpdate()) {
    <div class="cover-chips">
      @if (hasCover()) {
        <button
          type="button"
          class="cover-chip cover-chip--remove"
          [disabled]="cover.saving()"
          [attr.aria-label]="
            theme.tone()['common.retirer'] + ' — ' + theme.tone()['partie.cover_remove']
          "
          (click)="onRemove()"
        >
          {{ theme.tone()['common.retirer'] }}
        </button>
      }
      <!-- Le champ fichier natif couvre la puce en opacité 0 : jamais display:none ni hidden, pour que
           Tab l'atteigne et que Entrée/Espace ouvre le sélecteur de fichier. -->
      <label class="cover-chip cover-chip--pick" [class.cover-chip--disabled]="cover.saving()">
        <app-icon class="cover-chip__icon" name="modifier" />
        <span>{{
          hasCover() ? theme.tone()['common.changer'] : theme.tone()['partie.cover_add']
        }}</span>
        <input
          type="file"
          class="cover-file-input"
          #picker
          accept="image/jpeg,image/png,image/webp"
          [disabled]="cover.saving()"
          [attr.aria-label]="
            hasCover()
              ? theme.tone()['common.changer'] + ' — ' + theme.tone()['partie.cover_change']
              : null
          "
          (change)="onFileSelected($event)"
        />
      </label>
    </div>
  }
</div>
