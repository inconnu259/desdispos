# En-têtes de sécurité des pages du front. Inclus dans CHAQUE location de nginx.conf : une location qui
# déclare son propre add_header n'hérite plus de ceux du niveau server.
#
# CSP : scripts uniquement du site lui-même (aucun script inline) ; styles inline autorisés (Angular
# injecte les styles de composants en <style>) ; polices Google Fonts (index.html) ; images en data:/blob:
# (aperçus de recadrage) ; appels réseau vers la même origine seulement (/api, flux SSE).
# Corollaire : `inlineCritical` est désactivé dans apps/web/angular.json (production) — il charge la
# feuille de style via un attribut `onload=` en ligne, que `script-src 'self'` bloque (page sans styles).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options 'nosniff' always;
add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
add_header X-Frame-Options 'DENY' always;
add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
add_header Cross-Origin-Opener-Policy 'same-origin' always;
# HSTS : ignoré par les navigateurs en HTTP (test local), actif derrière le tunnel en HTTPS.
add_header Strict-Transport-Security 'max-age=31536000' always;
