# nginx de production : sert le front Angular et relaie /api vers l'API, sur UNE seule origine.
# Chaîne : visiteur → Cloudflare → cloudflared (réseau Docker) → nginx → api.

# IP réelle du visiteur : Cloudflare la donne dans CF-Connecting-IP. On ÉCRASE X-Forwarded-For avec (au
# lieu d'y ajouter) : un visiteur ne peut donc pas y glisser une fausse IP pour contourner la limitation
# de débit. nginx n'est joignable que depuis le réseau Docker (aucun port public), donc l'en-tête ne peut
# venir que de cloudflared. Sans tunnel (test local), repli sur l'adresse de connexion.
map $http_cf_connecting_ip $client_ip {
    ''      $remote_addr;
    default $http_cf_connecting_ip;
}

# Le tunnel arrive en HTTP mais transmet le schéma d'origine (https) ; l'API s'en sert pour le cookie
# `secure` (trust proxy).
map $http_x_forwarded_proto $forwarded_proto {
    ''      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Plafond de corps de requête : les envois de fichiers sont limités à 5 Mo côté API.
    client_max_body_size 6m;

    location /api/ {
        # La barre finale retire le préfixe : /api/auth/login → http://api:3000/auth/login.
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header CF-Connecting-IP '';
        # Flux temps réel (SSE) : pas de mise en tampon, connexions longues (battement de cœur côté API).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # Les en-têtes de sécurité des réponses de l'API sont posés par helmet, côté API.
    }

    # index.html : jamais en cache (il référence les fichiers hachés de la version courante).
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control 'no-cache' always;
    }

    # Fichiers hachés du build (noms changeant à chaque version) : cache long.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control 'public, max-age=31536000, immutable' always;
        try_files $uri =404;
    }

    # Routes de l'application (SPA) : repli sur index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control 'no-cache' always;
        try_files $uri $uri/ /index.html;
    }
}
